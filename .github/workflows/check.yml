name: Check extension
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm test
      - name: Package VSIX
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          mkdir -p "$stage/extension" dist
          cp package.json index.js garmin.js updates.js hooks.js hook-install.js README.md "$stage/extension/"
          cp scripts/content-types.xml "$stage/[Content_Types].xml"
          # Change the extension Identity version, not the PackageManifest schema version.
          sed -E "s/(<Identity[^>]* Version=\")[^\"]*/\1$version/" \
            scripts/extension.vsixmanifest > "$stage/extension.vsixmanifest"
          grep -Fq "Id=\"push-for-peace\" Version=\"$version\"" "$stage/extension.vsixmanifest"
          archive="$PWD/dist/push-for-peace-$version.vsix"
          rm -f "$archive"
          (cd "$stage" && zip -q -r "$archive" extension.vsixmanifest '[Content_Types].xml' extension)
          unzip -tq "$archive"
