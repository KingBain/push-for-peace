name: Code Security Scan

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BEARER_IMAGE: "docker.io/bearer/bearer:2.0.2@sha256:b3482c311044d9dd0dc98e929bd08fa38a2ef75a4190af0a093de2b62cc76b21"
  BANDIT_VERSION: "1.9.4"

jobs:
  bearer-scan:
    name: Bearer Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Bearer
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -w "$GITHUB_WORKSPACE" \
            "$BEARER_IMAGE" \
            scan . \
            --severity critical,high \
            --format sarif \
            --hide-progress-bar \
            --exit-code 0 \
            > "$RUNNER_TEMP/bearer.sarif"

      - name: Normalize SARIF fingerprints
        shell: bash
        run: |
          set -euo pipefail

          jq 'del(.runs[].results[]?.partialFingerprints.primaryLocationLineHash)' \
            "$RUNNER_TEMP/bearer.sarif" \
            > "$RUNNER_TEMP/bearer-normalized.sarif"

          mv "$RUNNER_TEMP/bearer-normalized.sarif" \
            "$RUNNER_TEMP/bearer.sarif"

      - name: Validate SARIF report
        shell: bash
        run: |
          set -euo pipefail

          jq -e '
            .version == "2.1.0" and
            (.runs | type == "array" and length > 0)
          ' "$RUNNER_TEMP/bearer.sarif" > /dev/null

      - name: Display scan results
        run: |
          jq '{
            total_findings: ([.runs[].results[]?] | length)
          }' "$RUNNER_TEMP/bearer.sarif"

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/bearer.sarif
          category: bearer

  bandit-scan:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Bandit
        shell: bash
        run: |
          set -euo pipefail

          python -m venv "$RUNNER_TEMP/bandit-venv"

          "$RUNNER_TEMP/bandit-venv/bin/pip" install \
            "bandit[sarif]==${BANDIT_VERSION}"

      - name: Run Bandit
        shell: bash
        run: |
          set -euo pipefail

          "$RUNNER_TEMP/bandit-venv/bin/bandit" \
            -r . \
            --exclude ".git,.venv,dist" \
            --severity-level medium \
            --confidence-level high \
            --format sarif \
            --exit-zero \
            --output "$RUNNER_TEMP/bandit.sarif"

      - name: Validate SARIF report
        shell: bash
        run: |
          set -euo pipefail

          jq -e '
            .version == "2.1.0" and
            (.runs | type == "array" and length > 0) and
            ([
              .runs[].invocations[]? |
              (
                .toolConfigurationNotifications[]?,
                .toolExecutionNotifications[]?
              ) |
              select(.level == "error")
            ] | length == 0)
          ' "$RUNNER_TEMP/bandit.sarif" > /dev/null

      - name: Display scan results
        run: |
          jq '{
            total_findings: ([.runs[].results[]?] | length)
          }' "$RUNNER_TEMP/bandit.sarif"

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/bandit.sarif
          category: bandit
